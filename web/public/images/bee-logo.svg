<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="58" r="28" fill="#F5A623" opacity="0.15"/>
  <!-- Wings -->
  <ellipse cx="32" cy="34" rx="16" ry="11" fill="white" stroke="#D1D5DB" stroke-width="1.5" transform="rotate(-20 32 34)" opacity="0.9"/>
  <ellipse cx="68" cy="34" rx="16" ry="11" fill="white" stroke="#D1D5DB" stroke-width="1.5" transform="rotate(20 68 34)" opacity="0.9"/>
  <!-- Inner wings -->
  <ellipse cx="35" cy="33" rx="10" ry="6" fill="white" stroke="#E5E7EB" stroke-width="1" transform="rotate(-20 35 33)" opacity="0.5"/>
  <ellipse cx="65" cy="33" rx="10" ry="6" fill="white" stroke="#E5E7EB" stroke-width="1" transform="rotate(20 65 33)" opacity="0.5"/>
  <!-- Body -->
  <ellipse cx="50" cy="56" rx="22" ry="26" fill="#F5A623"/>
  <!-- Stripes -->
  <rect x="35" y="46" width="30" height="7" rx="3" fill="#2D2D2D" clip-path="url(#body-clip)"/>
  <rect x="37" y="58" width="26" height="7" rx="3" fill="#2D2D2D" clip-path="url(#body-clip)"/>
  <rect x="40" y="70" width="20" height="7" rx="3" fill="#2D2D2D" clip-path="url(#body-clip)"/>
  <!-- Head -->
  <circle cx="50" cy="27" r="12" fill="#F5A623"/>
  <!-- Eyes -->
  <circle cx="45" cy="25" r="2.5" fill="#2D2D2D"/>
  <circle cx="55" cy="25" r="2.5" fill="#2D2D2D"/>
  <!-- Eye highlights -->
  <circle cx="44" cy="24" r="1" fill="white"/>
  <circle cx="54" cy="24" r="1" fill="white"/>
  <!-- Antennae -->
  <path d="M43 18 Q38 8 33 6" fill="none" stroke="#2D2D2D" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M57 18 Q62 8 67 6" fill="none" stroke="#2D2D2D" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="33" cy="6" r="2" fill="#2D2D2D"/>
  <circle cx="67" cy="6" r="2" fill="#2D2D2D"/>
  <!-- Stinger -->
  <path d="M50 82 L48 88 L52 88 Z" fill="#2D2D2D"/>
  <!-- Legs -->
  <path d="M36 52 L26 56 L24 60" fill="none" stroke="#2D2D2D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 52 L74 56 L76 60" fill="none" stroke="#2D2D2D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M38 64 L30 70 L28 74" fill="none" stroke="#2D2D2D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M62 64 L70 70 L72 74" fill="none" stroke="#2D2D2D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Smile -->
  <path d="M45 32 Q50 36 55 32" fill="none" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>
  <defs>
    <clipPath id="body-clip">
      <ellipse cx="50" cy="56" rx="22" ry="26"/>
    </clipPath>
